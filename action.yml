name: Set up hproxy
description: Install the hproxy command-line tool, and start a rotating proxy for the rest of the job if you like.
author: HProxy
branding:
  icon: shuffle
  color: blue

inputs:
  connect:
    description: >-
      Start a rotating proxy for the rest of the job: "free" for the free HProxy pool, or one proxy
      line in any shape your provider prints (host:port:user:pass, http://user:pass@host:port,
      socks5://...). Keep a line with a login in a secret. Empty: install only.
    required: false
    default: ""
  proxies-file:
    description: >-
      A file in the workspace with one proxy per line, used in turn (in place of connect).
    required: false
    default: ""
  rotate:
    description: "With proxies-file: every, every:N, every:Nm (minutes), random or on-failure."
    required: false
    default: every
  country:
    description: "With connect: free, a two-letter country, e.g. US or DE."
    required: false
    default: ""
  socks5:
    description: "With connect: free, SOCKS5 exits only."
    required: false
    default: "false"
  skip:
    description: >-
      Sites that go straight out, past the proxy: names (each covers everything under it),
      addresses or ranges such as 10.0.0.0/8, separated by commas.
    required: false
    default: ""
  only:
    description: Only these sites use the proxy, everything else goes straight out. Same shapes as skip.
    required: false
    default: ""
  via:
    description: >-
      A proxy in front of the proxy, so the proxy only ever sees its address. Any shape a
      provider prints; keep a line with a login in a secret.
    required: false
    default: ""
  listen:
    description: Where the proxy listens. Only this job's machine can reach it.
    required: false
    default: 127.0.0.1:8080
  export-proxy:
    description: >-
      Set HTTP_PROXY, HTTPS_PROXY and ALL_PROXY for the steps that follow, and add this machine
      (localhost, 127.0.0.1, ::1) to NO_PROXY so the job's own local servers stay reachable.
    required: false
    default: "true"

outputs:
  version:
    description: The hproxy version installed.
    value: ${{ steps.install.outputs.version }}
  proxy-url:
    description: The proxy's address, http://127.0.0.1:8080, when one was started.
    value: ${{ steps.connect.outputs.proxy-url }}

runs:
  using: composite
  steps:
    - name: Install hproxy (Linux, macOS)
      if: runner.os != 'Windows'
      shell: bash
      env:
        HPROXY_INSTALL_DIR: ${{ runner.tool_cache }}/hproxy
      run: |
        curl -fsSL https://hproxy.com/install.sh | sh
        echo "$HPROXY_INSTALL_DIR" >> "$GITHUB_PATH"

    - name: Install hproxy (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        HPROXY_INSTALL_DIR: ${{ runner.tool_cache }}\hproxy
        HPROXY_NO_PATH: "1"
      run: |
        irm https://hproxy.com/install.ps1 | iex
        Add-Content -Path $env:GITHUB_PATH -Value $env:HPROXY_INSTALL_DIR

    - name: The version
      id: install
      shell: bash
      env:
        HPROXY_NO_UPDATE_CHECK: "1"
        HPROXY_NO_USAGE: "1"
      run: |
        version=$(hproxy --version | sed -n 's/^hproxy //p')
        echo "hproxy $version"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Start the rotating proxy
      id: connect
      if: inputs.connect != '' || inputs.proxies-file != ''
      shell: bash
      env:
        CONNECT: ${{ inputs.connect }}
        PROXIES_FILE: ${{ inputs.proxies-file }}
        ROTATE: ${{ inputs.rotate }}
        COUNTRY: ${{ inputs.country }}
        SOCKS5: ${{ inputs.socks5 }}
        SKIP: ${{ inputs.skip }}
        ONLY: ${{ inputs.only }}
        VIA: ${{ inputs.via }}
        LISTEN: ${{ inputs.listen }}
        EXPORT: ${{ inputs.export-proxy }}
        HPROXY_NO_UPDATE_CHECK: "1"
        HPROXY_NO_USAGE: "1"
      run: |
        args=(connect)
        if [ -n "$PROXIES_FILE" ]; then
          args+=(--file "$PROXIES_FILE" --rotate "$ROTATE")
        elif [ "$CONNECT" = free ]; then
          args+=(--free)
          if [ -n "$COUNTRY" ]; then args+=(--country "$COUNTRY"); fi
          if [ "$SOCKS5" = true ]; then args+=(--socks5); fi
        else
          args+=("$CONNECT")
        fi
        if [ -n "$SKIP" ]; then args+=(--skip "$SKIP"); fi
        if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
        if [ -n "$VIA" ]; then args+=(--via "$VIA"); fi
        args+=(--listen "$LISTEN" --json)
        if [ -n "$SKIP$ONLY$VIA" ]; then
          # A connection in the foreground keeps its sites and first hop on every hproxy version,
          # one in the background from hproxy 0.4.9 on. So this one runs as a process of the job,
          # until the job ends.
          log="$RUNNER_TEMP/hproxy-connect-$RANDOM.log"
          nohup hproxy "${args[@]}" > "$log" 2>&1 &
          pid=$!
          ready=""
          for i in $(seq 120); do
            ready=$(grep -m1 '"listening"' "$log" 2> /dev/null || true)
            if [ -n "$ready" ] || ! kill -0 "$pid" 2> /dev/null; then break; fi
            sleep 0.5
          done
          if [ -z "$ready" ]; then ready=$(cat "$log"); fi
        else
          ready=$(hproxy "${args[@]}" --background)
        fi
        url=$(printf '%s' "$ready" | sed -n 's/.*"http_proxy":"\([^"]*\)".*/\1/p')
        if [ -z "$url" ]; then
          echo "::error::the proxy did not start: $ready"
          exit 1
        fi
        echo "The rotating proxy listens at $url"
        echo "proxy-url=$url" >> "$GITHUB_OUTPUT"
        if [ "$EXPORT" = true ]; then
          # This machine stays off the proxy: a proxy elsewhere cannot reach the job's own local
          # servers, and the job's own exemptions are kept.
          here=localhost,127.0.0.1,::1
          no_proxy_now=${NO_PROXY:-${no_proxy:-}}
          {
            echo "HTTP_PROXY=$url"
            echo "HTTPS_PROXY=$url"
            echo "ALL_PROXY=$url"
            echo "http_proxy=$url"
            echo "https_proxy=$url"
            echo "all_proxy=$url"
            echo "NO_PROXY=${no_proxy_now:+$no_proxy_now,}$here"
            echo "no_proxy=${no_proxy_now:+$no_proxy_now,}$here"
          } >> "$GITHUB_ENV"
        fi
